apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocr-html-parser.fullname" . }}
  labels:
    {{- include "ocr-html-parser.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ocr-html-parser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ocr-html-parser.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ocr-html-parser.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          # The parser service receives HANA, Blob, and flag values from shared Kubernetes resources.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Values.configmap.name }}
            - secretRef:
                name: {{ .Values.secret.name }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
