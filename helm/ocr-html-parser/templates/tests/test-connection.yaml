apiVersion: v1
kind: Pod
metadata:
  name: "{{ include \"ocr-html-parser.fullname\" . }}-test-connection"
  labels:
    {{- include "ocr-html-parser.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "ocr-html-parser.fullname" . }}:{{ .Values.service.port }}/']
