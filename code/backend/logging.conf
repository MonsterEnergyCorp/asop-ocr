[loggers]
keys=root

[handlers]
keys=consoleHandler

[formatters]
keys=aiopsFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=aiopsFormatter
args=(sys.stdout,)

[formatter_aiopsFormatter]
format=%(asctime)s [%(pathname)s:%(lineno)d] %(levelname)s %(message)s